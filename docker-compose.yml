services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}
    container_name: ezygo_app
    restart: unless-stopped
    # ports:
    #   - "127.0.0.1:3000:3000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - ezygo_network

  db:
    image: postgres:16-alpine
    container_name: ezygo_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/sql:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ezygo_network

  migrate:
    image: postgres:16-alpine
    container_name: ezygo_migrate
    restart: "no"
    env_file:
      - .env
    environment:
      PGPASSWORD: ${DB_PASSWORD}
    volumes:
      - ./scripts/sql:/migrations:ro
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -ec
      - |
        for migration in \
          /migrations/002_better_auth.sql \
          /migrations/003_delivery_checkout_details.sql \
          /migrations/004_payment_attempt_integrity.sql \
          /migrations/005_driver_location_auto_assignment.sql \
          /migrations/006_delivery_recipient_pin.sql \
          /migrations/007_delivery_completion_email.sql
        do
          echo "Applying $${migration}"
          psql -v ON_ERROR_STOP=1 -h db -U "$${DB_USER}" -d "$${DB_NAME}" -f "$${migration}"
        done
    networks:
      - ezygo_network

volumes:
  postgres_data:
    driver: local

networks:
  ezygo_network:
    driver: bridge
