services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}
        GOOGLE_ROUTES_API_KEY: ${GOOGLE_ROUTES_API_KEY}
    environment:
      ENABLE_NOTIFICATION_WORKER: "true"
      DB_HOST: db
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    container_name: ezygo_app
    restart: unless-stopped
    # Host Nginx forwards public and admin traffic to this loopback port.
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - ezygo_database
      - ezygo_network

  db:
    image: postgres:16-alpine
    container_name: ezygo_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ezygo_database

  migrate:
    image: postgres:16-alpine
    container_name: ezygo_migrate
    restart: "no"
    env_file:
      - .env
    environment:
      PGPASSWORD: ${DB_PASSWORD}
    volumes:
      - ./scripts/sql:/migrations:ro
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -ec
      - |
        for migration in \
          /migrations/002_better_auth.sql \
          /migrations/003_delivery_checkout_details.sql \
          /migrations/004_payment_attempt_integrity.sql \
          /migrations/005_driver_location_auto_assignment.sql \
          /migrations/006_delivery_recipient_pin.sql \
          /migrations/007_delivery_completion_email.sql \
          /migrations/008_payment_providers.sql \
          /migrations/009_paystack_provider.sql \
          /migrations/010_push_subscriptions.sql \
          /migrations/011_yoco_provider.sql \
          /migrations/012_driver_earnings.sql \
          /migrations/013_security_payment_integrity.sql \
          /migrations/014_list_pagination.sql \
          /migrations/015_delivery_email_templates.sql \
          /migrations/016_delivery_cancellation_email.sql \
          /migrations/017_user_analytics.sql \
          /migrations/018_mobile_google_oauth.sql
        do
          echo "Applying $${migration}"
          psql -v ON_ERROR_STOP=1 -h db -U "$${DB_USER}" -d "$${DB_NAME}" -f "$${migration}"
        done
    networks:
      - ezygo_database

volumes:
  postgres_data:
    driver: local

networks:
  ezygo_database:
    internal: true
  ezygo_network:
    driver: bridge
