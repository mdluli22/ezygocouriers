name: Deploy EzyGo

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -eu
            cd "${{ secrets.APP_DIR }}"

            # Deploy the requested release even if the server has local commits.
            # Preserve those commits and refuse to overwrite uncommitted edits.
            git fetch origin main
            git diff --quiet && git diff --cached --quiet || {
              echo "Server has uncommitted tracked changes; preserve them before deploying."
              git status --short
              exit 1
            }
            if test "$(git rev-parse HEAD)" != "${{ github.sha }}"; then
              backup_branch="deploy-backup/$(date -u +%Y%m%dT%H%M%SZ)-$(git rev-parse --short HEAD)"
              git branch "$backup_branch" HEAD
              echo "Previous server revision preserved on $backup_branch"
            fi
            git checkout --detach "${{ github.sha }}"
            test "$(git rev-parse HEAD)" = "${{ github.sha }}" || {
              echo "Server checkout does not match the release commit."
              exit 1
            }

            # Build before replacing the running app. A failed build must fail
            # the deployment rather than restart the previous image.
            docker compose build app

            # Existing Postgres volumes do not re-run /docker-entrypoint-initdb.d.
            # Run the idempotent migrations explicitly and fail the deployment
            # before starting the app if any schema change cannot be applied.
            docker compose up -d db
            docker compose run --rm migrate

            docker compose up -d --no-deps app

            docker image prune -f
