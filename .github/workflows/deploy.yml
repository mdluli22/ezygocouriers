name: Deploy EzyGo

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.APP_DIR }}

            git pull origin main

            docker compose down

            # Existing Postgres volumes do not re-run /docker-entrypoint-initdb.d.
            # Run the idempotent migrations explicitly and fail the deployment
            # before starting the app if any schema change cannot be applied.
            docker compose up -d db
            docker compose run --rm migrate

            docker compose up -d --build --no-deps app

            docker image prune -f
